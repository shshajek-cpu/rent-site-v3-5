<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈 설정 - Car Manager</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .brand-logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .brand-logo-card {
            /* Inherits card styles from admin.css */
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .brand-logo-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .brand-logo-preview {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .brand-logo-preview img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .brand-logo-preview .placeholder-icon {
            font-size: 24px;
            color: var(--text-sub);
        }

        .brand-info {
            flex: 1;
            min-width: 0;
        }

        .brand-info h3 {
            margin: 0 0 4px 0;
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .brand-info p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .logo-input-group {
            display: flex;
            gap: 0.5rem;
            align-items: stretch;
        }
        
        /* Inputs and buttons are handled by admin.css globally now */

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title i {
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
        }

        .section-subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <h2>Admin</h2>
            </div>
            <nav class="side-nav">
                <a href="admin-list.html" class="nav-link">
                    <i class="fas fa-list"></i>
                    차량 목록 관리
                </a>
                <a href="admin-quotes.html" class="nav-link">
                    <i class="fas fa-file-invoice"></i>
                    견적 관리
                </a>
                <a href="admin-reviews.html" class="nav-link">
                    <i class="fas fa-star"></i>
                    출고 후기
                </a>
                <a href="admin-home.html" class="nav-link active">
                    <i class="fas fa-home"></i>
                    홈 설정
                </a>
                <a href="admin-inquiries.html" class="nav-link">
                    <i class="fas fa-phone-alt"></i>
                    신규 접수 DB
                </a>
            </nav>
            <div style="margin-top: auto; padding-top: 2rem;">
                <a href="landing.html" class="nav-link">
                    <i class="fas fa-rocket"></i>
                    랜딩페이지 이동
                </a>
                <a href="index.html" class="nav-link">
                    <i class="fas fa-external-link-alt"></i>
                    메인 사이트 이동
                </a>
                <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 1rem 0;"></div>
                <button onclick="logout()" class="nav-link"
                    style="width: 100%; background: none; border: none; cursor: pointer; text-align: left;">
                    <i class="fas fa-sign-out-alt"></i>
                    로그아웃
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content-area">
            <header class="content-header">
                <h1>홈 설정</h1>
                <p>메인 페이지의 브랜드 카테고리 로고를 설정합니다.</p>
            </header>

            <!-- Brand Logo Settings -->
            <div class="section-title">
                <i class="fas fa-image"></i>
                카테고리 로고 설정
            </div>
            <p class="section-subtitle">브랜드 카테고리에 표시될 로고 이미지를 설정하세요. URL을 입력하거나 파일을 업로드할 수 있습니다.</p>

            <button class="btn-save-all" onclick="saveAllLogos()">
                <i class="fas fa-save"></i> 모두 저장
            </button>

            <div class="brand-logo-grid" id="brandLogoGrid">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </main>
    </div>

    <script src="auth.js"></script>
    <script>
        protectAdminPage();
    </script>
    <script src="toast.js"></script>
    <script>
        // DB Helper
        function getDB() {
            const local = localStorage.getItem('carDB');
            if (local) return JSON.parse(local);
            return { brands: [], cars: [] };
        }

        function saveDB(data) {
            localStorage.setItem('carDB', JSON.stringify(data));
        }

        // 브랜드 로고 렌더링
        function renderBrandLogos() {
            const db = getDB();
            const container = document.getElementById('brandLogoGrid');

            if (!db.brands || db.brands.length === 0) {
                container.innerHTML = '<p>등록된 브랜드가 없습니다.</p>';
                return;
            }

            container.innerHTML = db.brands.map(brand => {
                const hasLogo = brand.logoUrl && brand.logoUrl.trim() !== '';
                return `
                    <div class="brand-logo-card" data-brand-id="${brand.id}">
                        <div class="brand-logo-header">
                            <div class="brand-logo-preview" id="preview-${brand.id}">
                                ${hasLogo
                        ? `<img src="${brand.logoUrl}" alt="${brand.name}" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-image placeholder-icon\\'></i>'">`
                        : `<i class="fas fa-image placeholder-icon"></i>`
                    }
                            </div>
                            <div class="brand-info">
                                <h3>${brand.name}</h3>
                                <p>ID: ${brand.id}</p>
                            </div>
                        </div>
                        <div class="logo-input-group">
                            <input type="url" id="logo-url-${brand.id}" 
                                   placeholder="로고 이미지 URL 입력" 
                                   value="${brand.logoUrl || ''}">
                            <label for="logo-file-${brand.id}" class="btn-upload">
                                <i class="fas fa-upload"></i> 업로드
                            </label>
                            <input type="file" id="logo-file-${brand.id}" 
                                   accept="image/*" style="display: none;"
                                   onchange="handleLogoUpload('${brand.id}', this)">
                        </div>
                        <button class="btn-save-logo" onclick="saveBrandLogo('${brand.id}')">
                            <i class="fas fa-save"></i> 저장
                        </button>
                    </div>
                `;
            }).join('');
        }

        // 파일 업로드 핸들러
        function handleLogoUpload(brandId, input) {
            const file = input.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
                Toast.error('파일 크기는 2MB 이하여야 합니다.');
                return;
            }

            if (!file.type.startsWith('image/')) {
                Toast.error('이미지 파일만 업로드 가능합니다.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const base64 = e.target.result;
                document.getElementById(`logo-url-${brandId}`).value = base64;

                // 미리보기 업데이트
                const preview = document.getElementById(`preview-${brandId}`);
                preview.innerHTML = `<img src="${base64}" alt="Preview">`;

                Toast.success('이미지가 업로드되었습니다. 저장 버튼을 클릭해주세요.');
            };
            reader.readAsDataURL(file);
        }

        // 로고 저장
        function saveBrandLogo(brandId) {
            const logoUrl = document.getElementById(`logo-url-${brandId}`).value.trim();
            const db = getDB();

            const brandIndex = db.brands.findIndex(b => b.id === brandId);
            if (brandIndex === -1) {
                Toast.error('브랜드를 찾을 수 없습니다.');
                return;
            }

            db.brands[brandIndex].logoUrl = logoUrl;
            saveDB(db);

            // 미리보기 업데이트
            const preview = document.getElementById(`preview-${brandId}`);
            if (logoUrl) {
                preview.innerHTML = `<img src="${logoUrl}" alt="${db.brands[brandIndex].name}" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-image placeholder-icon\\'></i>'">`;
            } else {
                preview.innerHTML = '<i class="fas fa-image placeholder-icon"></i>';
            }

            Toast.success(`${db.brands[brandIndex].name} 로고가 저장되었습니다!`);
        }

        // 모두 저장
        function saveAllLogos() {
            const db = getDB();
            let savedCount = 0;

            db.brands.forEach(brand => {
                const logoUrl = document.getElementById(`logo-url-${brand.id}`)?.value.trim();
                if (logoUrl !== undefined) {
                    const brandIndex = db.brands.findIndex(b => b.id === brand.id);
                    if (brandIndex !== -1) {
                        db.brands[brandIndex].logoUrl = logoUrl;
                        savedCount++;

                        // 미리보기 업데이트
                        const preview = document.getElementById(`preview-${brand.id}`);
                        if (logoUrl) {
                            preview.innerHTML = `<img src="${logoUrl}" alt="${brand.name}" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-image placeholder-icon\\'></i>'">`;
                        } else {
                            preview.innerHTML = '<i class="fas fa-image placeholder-icon"></i>';
                        }
                    }
                }
            });

            saveDB(db);
            Toast.success(`${savedCount}개의 브랜드 로고가 모두 저장되었습니다!`);
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', renderBrandLogos);
    </script>
</body>

</html>
