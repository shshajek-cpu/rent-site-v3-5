<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Animation Test</title>
    <link rel="stylesheet" href="test_animation.css">
</head>
<body>

    <div class="blue-countdown-banner">
        <div class="banner-content">
            <div class="text-container">
                <div class="banner-text">특판할인 마감임박</div>
                <div class="banner-subtext">실시간 특가 차량 남은 수량</div>
            </div>
            <div class="countdown-display">
                <div class="digit-box">
                    <div class="digit-viewport" style="transform: translateY(-60px);">
                        <div class="digit-value">0</div><div class="digit-value">1</div><div class="digit-value">2</div><div class="digit-value">3</div><div class="digit-value">4</div><div class="digit-value">5</div><div class="digit-value">6</div><div class="digit-value">7</div><div class="digit-value">8</div><div class="digit-value">9</div>
                    </div>
                </div>
                <div class="digit-box">
                    <div class="digit-viewport" style="transform: translateY(-120px);">
                        <div class="digit-value">0</div><div class="digit-value">1</div><div class="digit-value">2</div><div class="digit-value">3</div><div class="digit-value">4</div><div class="digit-value">5</div><div class="digit-value">6</div><div class="digit-value">7</div><div class="digit-value">8</div><div class="digit-value">9</div>
                    </div>
                </div>
                <div class="digit-box">
                    <div class="digit-viewport" style="transform: translateY(-60px);">
                        <div class="digit-value">0</div><div class="digit-value">1</div><div class="digit-value">2</div><div class="digit-value">3</div><div class="digit-value">4</div><div class="digit-value">5</div><div class="digit-value">6</div><div class="digit-value">7</div><div class="digit-value">8</div><div class="digit-value">9</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
