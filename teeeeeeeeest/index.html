<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logobly - Galaxy Discovery</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Outfit:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #020617;
            --accent-blue: #2563eb;
            --text-white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
                url('http://localhost:3845/assets/c0da96e164a4076e8a42f0a217c9d885eda7fca9.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-white);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Particles/Stars effect placeholder */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('http://localhost:3845/assets/f6bcfbdcd5c03a13a6e25fad60c59ca647324617.png');
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        header {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            height: 40px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        nav ul li a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        nav ul li a:hover {
            opacity: 1;
        }

        .locate-btn {
            background: var(--accent-blue);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .locate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 5;
            width: 100%;
        }

        .subtitle {
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.8;
            font-weight: 300;
        }

        .hero-title-container {
            position: relative;
            margin: 40px 0;
        }

        .hero-title-bg {
            font-size: 180px;
            font-weight: 700;
            line-height: 1;
            opacity: 0.1;
            letter-spacing: 20px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            z-index: -1;
        }

        .planet-container {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-planet {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(37, 99, 235, 0.2);
            animation: float 6s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }

        .hero-text-overlay {
            position: absolute;
            z-index: 3;
            pointer-events: none;
            width: 100%;
        }

        .hero-text-overlay h1 {
            font-size: 140px;
            font-weight: 700;
            letter-spacing: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-text-overlay h1 span:nth-child(2) {
            -webkit-text-stroke: 1px white;
            color: transparent;
        }

        .orbit-line {
            position: absolute;
            width: 900px;
            height: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-5deg);
            z-index: 1;
        }

        .mini-planet {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            z-index: 4;
        }

        .mini-planet.seyfert {
            left: -30px;
            top: 70%;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.3);
        }

        .mini-planet.elliptical {
            right: -30px;
            top: 70%;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        .planet-label {
            position: absolute;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .planet-label.left {
            left: -120px;
            top: 72%;
        }

        .planet-label.right {
            right: -120px;
            top: 72%;
        }

        .description {
            max-width: 600px;
            margin: 40px 0;
            line-height: 1.6;
            color: var(--text-dim);
            font-weight: 300;
            font-size: 16px;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 8px 8px 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }

        .search-container input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .search-container input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .search-btn:hover {
            opacity: 0.9;
        }

        .scroll-down {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-dim);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 1000px) {
            .hero-text-overlay h1 {
                font-size: 100px;
            }

            .hero-title-bg {
                font-size: 120px;
            }

            .planet-container {
                width: 350px;
                height: 350px;
            }

            .orbit-line {
                width: 700px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <img src="http://localhost:3845/assets/9a7bddc58fb58c50931d0b13defdd79111b3d360.svg" alt="Logobly Logo">
            LOGÖBLY
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Company</a></li>
                <li><a href="#">Location</a></li>
                <li><a href="#">Service</a></li>
            </ul>
        </nav>
        <a href="#" class="locate-btn">
            <img src="http://localhost:3845/assets/36b8ce9dd9930ff02d3f05dd3ba41f74af96b48f.svg" width="18" alt="">
            LOCATE ME
        </a>
    </header>

    <main>
        <div class="subtitle">Embark on a journey of discovery across the cosmos</div>

        <div class="hero-title-container">
            <div class="hero-title-bg">DISCOVERY</div>
            <div class="planet-container">
                <img src="http://localhost:3845/assets/06568b4b8a67cb009a57ac12fdb8823af57a67c9.svg" class="main-planet"
                    alt="Blue Planet">
                <div class="hero-text-overlay">
                    <h1>
                        <span>GA</span>
                        <span>LAXY</span>
                    </h1>
                    <div style="font-size: 16px; letter-spacing: 4px; margin-top: -10px;">LENTICULAR</div>
                </div>

                <div class="orbit-line"></div>

                <div class="planet-label left">Seyfert</div>
                <img src="http://localhost:3845/assets/75cacdc40c784f6878ae4ca88ac6d1494660d967.png"
                    class="mini-planet seyfert" alt="Seyfert Planet">

                <div class="planet-label right">Elliptical</div>
                <img src="http://localhost:3845/assets/4f7de593685ebbeed1e1a7814f1b32df0050b36a.png"
                    class="mini-planet elliptical" alt="Elliptical Planet">
            </div>
        </div>

        <div class="description">
            Suspendisse potenti. In eget augue egestas, gravida libero eu, luctus ipsum. Aliquam non pulvinar ex.
        </div>

        <div class="search-container">
            <input type="text" placeholder="Search by the location:">
            <button class="search-btn">SEARCH</button>
        </div>

        <div class="scroll-down">
            <img src="http://localhost:3845/assets/a0f5e2485949d042a8f83ece6b445b3647c31523.svg" width="24"
                alt="Scroll icon">
            Scroll Down
        </div>
    </main>
</body>

</html>
