<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신규 접수 DB - Car Manager</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <h2>Admin</h2>
            </div>
            <nav class="side-nav">
                <a href="admin-list.html" class="nav-link">
                    <i class="fas fa-list"></i>
                    차량 목록 관리
                </a>
                <a href="admin-quotes.html" class="nav-link">
                    <i class="fas fa-file-invoice"></i>
                    견적 관리
                </a>
                <a href="admin-reviews.html" class="nav-link">
                    <i class="fas fa-star"></i>
                    출고 후기
                </a>
                <a href="admin-home.html" class="nav-link">
                    <i class="fas fa-home"></i>
                    홈 설정
                </a>
                <a href="admin-inquiries.html" class="nav-link active">
                    <i class="fas fa-phone-alt"></i>
                    신규 접수 DB
                </a>
            </nav>
            <div style="margin-top: auto; padding-top: 2rem;">
                <a href="landing.html" class="nav-link">
                    <i class="fas fa-rocket"></i>
                    랜딩페이지 이동
                </a>
                <a href="index.html" class="nav-link">
                    <i class="fas fa-external-link-alt"></i>
                    메인 사이트 이동
                </a>
                <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 1rem 0;"></div>
                <button onclick="logout()" class="nav-link"
                    style="width: 100%; background: none; border: none; cursor: pointer; text-align: left;">
                    <i class="fas fa-sign-out-alt"></i>
                    로그아웃
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content-area">
            <header class="content-header">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>신규 접수 DB</h1>
                        <p>상담 신청 고객 정보 관리</p>
                    </div>
                    <button onclick="openAddModal()" class="btn-primary">
                        <i class="fas fa-plus"></i> 수동 등록
                    </button>
                </div>
            </header>

            <!-- Inquiry Table -->
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>이름</th>
                            <th>전화번호</th>
                            <th>차종</th>
                            <th>인증 상태</th>
                            <th>접수일시</th>
                            <th>메모</th>
                            <th>액션</th>
                        </tr>
                    </thead>
                    <tbody id="inquiryTableBody">
                        <!-- JavaScript로 동적 생성 -->
                    </tbody>
                </table>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-inbox" style="font-size: 64px; color: #E5E7EB; margin-bottom: 16px;"></i>
                <p style="color: #6B7280; font-size: 16px;">등록된 상담 신청이 없습니다.</p>
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">상담 신청 등록</h2>
                <button onclick="closeModal()" class="modal-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" id="inputName" placeholder="홍길동">
                </div>
                <div class="form-group">
                    <label>전화번호</label>
                    <input type="tel" id="inputPhone" placeholder="010-1234-5678">
                </div>
                <div class="form-group">
                    <label>차종</label>
                    <input type="text" id="inputCarModel" placeholder="그랜저">
                </div>
                <div class="form-group">
                    <label>메모</label>
                    <textarea id="inputMemo" rows="3" placeholder="특이사항 입력..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal()" class="btn-secondary">취소</button>
                <button onclick="saveInquiry()" class="btn-primary">저장</button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        protectAdminPage();
    </script>
    <script src="toast.js"></script>
    <script>
        let editingId = null;

        // DB 헬퍼
        function getInquiries() {
            const data = localStorage.getItem('inquiries');
            return data ? JSON.parse(data) : [];
        }

        function saveInquiries(inquiries) {
            localStorage.setItem('inquiries', JSON.stringify(inquiries));
        }

        // 테이블 렌더링
        function renderTable() {
            const inquiries = getInquiries();
            const tbody = document.getElementById('inquiryTableBody');
            const emptyState = document.getElementById('emptyState');

            if (inquiries.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'flex';
                return;
            }

            emptyState.style.display = 'none';
            // 최신순 정렬 (id가 timestamp이므로 내림차순)
            const sortedInquiries = [...inquiries].sort((a, b) => b.id - a.id);
            tbody.innerHTML = sortedInquiries.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.name}</td>
                    <td>${item.phone}</td>
                    <td>${item.carModel}</td>
                    <td>
                        ${item.verified
                    ? '<span class="status-badge status-active"><i class="fas fa-check-circle"></i> 인증됨</span>'
                    : '<span class="status-badge status-inactive">미인증</span>'}
                    </td>
                    <td>${item.timestamp}</td>
                    <td>
                        <input type="text" 
                               value="${item.memo || ''}" 
                               placeholder="메모 입력..."
                               onchange="updateMemo(${item.id}, this.value)"
                               style="padding: 6px; border: 1px solid #E5E7EB; border-radius: 6px; width: 100%;">
                    </td>
                    <td>
                        <button onclick="deleteInquiry(${item.id})" class="btn-delete" title="삭제">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 모달 열기
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = '상담 신청 등록';
            document.getElementById('inputName').value = '';
            document.getElementById('inputPhone').value = '';
            document.getElementById('inputCarModel').value = '';
            document.getElementById('inputMemo').value = '';
            document.getElementById('modalOverlay').classList.add('active');
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // 저장
        function saveInquiry() {
            const name = document.getElementById('inputName').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const carModel = document.getElementById('inputCarModel').value.trim();
            const memo = document.getElementById('inputMemo').value.trim();

            if (!name || !phone || !carModel) {
                Toast.error('이름, 전화번호, 차종은 필수입니다.');
                return;
            }

            const inquiries = getInquiries();
            const now = new Date();
            const timestamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newInquiry = {
                id: Date.now(),
                name,
                phone,
                carModel,
                timestamp,
                memo,
                verified: false
            };

            inquiries.push(newInquiry);
            saveInquiries(inquiries);
            renderTable();
            closeModal();
            Toast.success('상담 신청이 등록되었습니다!');
        }

        // 메모 업데이트
        function updateMemo(id, memo) {
            const inquiries = getInquiries();
            const index = inquiries.findIndex(i => i.id === id);
            if (index !== -1) {
                inquiries[index].memo = memo;
                saveInquiries(inquiries);
                Toast.success('메모가 저장되었습니다.');
            }
        }

        // 삭제
        function deleteInquiry(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;

            const inquiries = getInquiries();
            const filtered = inquiries.filter(i => i.id !== id);
            saveInquiries(filtered);
            renderTable();
            Toast.success('삭제되었습니다.');
        }

        // 초기 샘플 데이터 추가 (데이터가 없을 경우)
        function initSampleData() {
            const inquiries = getInquiries();
            if (inquiries.length === 0) {
                const sampleData = [
                    {
                        id: Date.now() - 300000,
                        name: "김민수",
                        phone: "010-1234-5678",
                        carModel: "그랜저 LE",
                        timestamp: "2025-12-28 14:30",
                        memo: "48개월 리스 상담 요청"
                    },
                    {
                        id: Date.now() - 200000,
                        name: "이지은",
                        phone: "010-9876-5432",
                        carModel: "GV70",
                        timestamp: "2025-12-28 15:45",
                        memo: "빠른 출고 문의"
                    },
                    {
                        id: Date.now() - 100000,
                        name: "박철수",
                        phone: "010-5555-7777",
                        carModel: "싼타페",
                        timestamp: "2025-12-28 16:20",
                        memo: ""
                    },
                    {
                        id: Date.now(),
                        name: "정유진",
                        phone: "010-3333-8888",
                        carModel: "쏘렌토",
                        timestamp: "2025-12-28 17:10",
                        memo: "장기렌트 견적 비교"
                    }
                ];
                saveInquiries(sampleData);
            }
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            initSampleData();
            renderTable();
        });
    </script>
</body>

</html>
