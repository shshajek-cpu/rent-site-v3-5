<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차량 수정 - Car Manager</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <h2>Admin</h2>
            </div>
            <nav class="side-nav">
                <a href="admin-list.html" class="nav-link">
                    <i class="fas fa-list"></i>
                    차량 목록 관리
                </a>
                <a href="admin-quotes.html" class="nav-link">
                    <i class="fas fa-file-invoice"></i>
                    견적 관리
                </a>
                <a href="admin-reviews.html" class="nav-link">
                    <i class="fas fa-star"></i>
                    출고 후기
                </a>
                <a href="admin-home.html" class="nav-link">
                    <i class="fas fa-home"></i>
                    홈 설정
                </a>
                <a href="admin-inquiries.html" class="nav-link">
                    <i class="fas fa-phone-alt"></i>
                    신규 접수 DB
                </a>
            </nav>
            <div style="margin-top: auto; padding-top: 2rem;">
                <a href="landing.html" class="nav-link">
                    <i class="fas fa-rocket"></i>
                    랜딩페이지 이동
                </a>
                <a href="index.html" class="nav-link">
                    <i class="fas fa-external-link-alt"></i>
                    메인 사이트 이동
                </a>
                <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 1rem 0;"></div>
                <button onclick="logout()" class="nav-link"
                    style="width: 100%; background: none; border: none; cursor: pointer; text-align: left;">
                    <i class="fas fa-sign-out-alt"></i>
                    로그아웃
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content-area">
            <header class="content-header">
                <h1>차량 정보 수정</h1>
                <p>선택한 차량의 정보를 수정할 수 있습니다.</p>
            </header>

            <div class="card form-card">
                <form id="editCarForm">
                    <input type="hidden" id="carId">

                    <div class="form-group">
                        <label for="brand">브랜드</label>
                        <select id="brand" required>
                            <option value="">브랜드를 선택하세요</option>
                            <option value="hyundai">현대 (Hyundai)</option>
                            <option value="kia">기아 (Kia)</option>
                            <option value="genesis">제네시스 (Genesis)</option>
                            <option value="benz">벤츠 (Benz)</option>
                            <option value="bmw">BMW</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="name">모델명</label>
                        <input type="text" id="name" placeholder="예: 그랜저, E-Class" required>
                    </div>

                    <div class="form-group">
                        <label for="grade">스펙 (등급/연료)</label>
                        <input type="text" id="grade" placeholder="예: 2.5 가솔린 프리미엄" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="price">월 렌탈료 (원)</label>
                            <input type="number" id="price" placeholder="예: 600000" required>
                        </div>
                        <div class="form-group">
                            <label for="mileage">주행거리/상태</label>
                            <input type="text" id="mileage" placeholder="예: 10,000km">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="image">이미지</label>
                        <div style="display: flex; gap: 1rem; align-items: flex-start;">
                            <div style="flex: 1;">
                                <input type="url" id="image" placeholder="https://example.com/car.jpg (비워두면 기본 아이콘)">
                                <small class="hint">이미지 주소를 입력하거나 파일을 업로드하세요.</small>
                            </div>
                            <div>
                                <label for="imageFile" class="btn-upload">
                                    <i class="fas fa-upload"></i> 파일 선택
                                </label>
                                <input type="file" id="imageFile" accept="image/*" style="display: none;">
                            </div>
                        </div>
                        <div id="imagePreview" style="margin-top: 1rem; display: none;">
                            <img id="previewImg"
                                style="max-width: 200px; max-height: 150px; border-radius: 6px; object-fit: cover;">
                        </div>
                    </div>

                    <div class="form-actions" style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" onclick="history.back()" class="btn-secondary">
                            취소
                        </button>
                        <button type="submit" class="btn-submit">
                            수정 완료
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="auth.js"></script>
    <script>
        protectAdminPage();
    </script>
    <script src="utils.js"></script>
    <script src="toast.js"></script>
    <script src="validation.js"></script>
    <script src="admin-edit.js"></script>
</body>

</html>
