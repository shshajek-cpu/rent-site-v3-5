<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        /* Statistics Cards - Layout specific overrides if needed */
        .stat-card {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .stat-info {
            flex: 1;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Review specific table styles */
        .review-rating-display {
            display: flex;
            gap: 0.15rem;
            font-size: 0.95rem;
        }

        .review-rating-display i {
            color: #FFC107;
            text-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
        }

        .review-rating-display .far {
            color: #4B5563;
        }

        .review-content-cell {
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-sub);
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-icon {
            padding: 0.5rem 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            white-space: nowrap;
            background: rgba(255,255,255,0.05);
            color: var(--text-sub);
        }

        .btn-icon:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            box-shadow: 0 0 10px var(--primary-color);
        }

        .btn-add-review {
            /* Inherits generic button styles but keeping the class for specificity if needed */
        }

        /* Rating Input in Modal */
        .rating-input {
            display: flex;
            gap: 0.5rem;
            font-size: 1.5rem;
        }

        .rating-input i {
            cursor: pointer;
            color: #4B5563;
            transition: all 0.2s;
        }

        .rating-input i.active,
        .rating-input i:hover {
            color: #FFC107;
            text-shadow: 0 0 15px rgba(255, 193, 7, 0.5);
            transform: scale(1.1);
        }

        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6rem 2rem;
            color: var(--text-sub);
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .empty-state i {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            opacity: 0.3;
            color: var(--primary-color);
        }

        /* Sortable Header */
        .sortable-header {
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: color 0.2s;
        }

        .sortable-header:hover {
            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .sort-icon {
            margin-left: 0.5rem;
            opacity: 0.3;
            transition: all 0.2s;
            display: inline-block;
        }

        .sortable-header.asc .sort-icon {
            opacity: 1;
            color: var(--primary-color);
            transform: rotate(180deg);
        }

        .sortable-header.desc .sort-icon {
            opacity: 1;
            color: var(--primary-color);
        }
    </style>
</head>

    <script>
        // 테이블 정렬 기능
        let currentSort = {
            field: null,
            direction: null // null, 'asc', 'desc'
        };

        function toggleSort(field) {
            const th = document.getElementById(`th-${field}`);
            const icon = th.querySelector('.sort-icon');

            // 다른 컬럼의 정렬 초기화
            if (currentSort.field && currentSort.field !== field) {
                const otherTh = document.getElementById(`th-${currentSort.field}`);
                otherTh.classList.remove('asc', 'desc');
                otherTh.querySelector('.sort-icon').className = 'fas fa-sort sort-icon';
            }

            // 정렬 방향 순환: null -> asc -> desc -> null
            if (currentSort.field === field) {
                if (currentSort.direction === 'asc') {
                    currentSort.direction = 'desc';
                    th.classList.remove('asc');
                    th.classList.add('desc');
                    icon.className = 'fas fa-sort-down sort-icon';
                } else if (currentSort.direction === 'desc') {
                    currentSort.direction = null;
                    currentSort.field = null;
                    th.classList.remove('desc');
                    icon.className = 'fas fa-sort sort-icon';
                    Toast.info('정렬이 초기화되었습니다.');
                    renderReviewTable(); // 원래 순서로 복구
                    return;
                } else {
                    currentSort.direction = 'asc';
                    th.classList.add('asc');
                    icon.className = 'fas fa-sort-up sort-icon';
                }
            } else {
                currentSort.field = field;
                currentSort.direction = 'asc';
                th.classList.add('asc');
                icon.className = 'fas fa-sort-up sort-icon';
            }

            // 정렬 적용
            sortAndRenderTable(field, currentSort.direction);
        }

        function sortAndRenderTable(field, direction) {
            const tbody = document.getElementById('reviewTableBody');
            const rows = Array.from(tbody.querySelectorAll('tr'));

            rows.sort((a, b) => {
                let aVal, bVal;

                if (field === 'rating') {
                    // 평점 정렬 (별 개수 세기)
                    aVal = a.querySelectorAll('.fas.fa-star').length;
                    bVal = b.querySelectorAll('.fas.fa-star').length;
                } else if (field === 'date') {
                    // 날짜 정렬 (timestamp 속성 사용)
                    const aDate = a.getAttribute('data-timestamp') || a.cells[6].textContent;
                    const bDate = b.getAttribute('data-timestamp') || b.cells[6].textContent;
                    aVal = new Date(aDate).getTime();
                    bVal = new Date(bDate).getTime();
                }

                if (direction === 'asc') {
                    return aVal - bVal;
                } else {
                    return bVal - aVal;
                }
            });

            // 재렌더링
            tbody.innerHTML = '';
            rows.forEach(row => tbody.appendChild(row));

            const directionText = direction === 'asc' ? '오름차순' : '내림차순';
            const fieldText = field === 'rating' ? '평점' : '등록일';
            Toast.info(`${fieldText} ${directionText} 정렬되었습니다.`);
        }

        function renderReviewTable() {
            // 기존 renderReviewTable 함수가 있다면 호출
            // 없다면 페이지 새로고침으로 원래 순서 복구
            location.reload();
        }
    </script>
